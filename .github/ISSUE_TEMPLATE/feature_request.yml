name: "Feature Request"
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Feature requests belong on our feedback portal

        **Please raise this at [feedback.patchmon.net](https://feedback.patchmon.net) instead.**

        That is where feature requests are tracked, voted on and prioritised. Raising it
        there means other users can upvote it, you can follow its progress, and you will be
        notified when it ships.

        If you continue here, nothing is lost — your request will be **imported to the
        feedback portal automatically**, you will get a comment with the direct link, and
        this issue will be closed. Please follow it on the portal from that point.

        ---

        Thanks for suggesting a feature! Please describe your idea in detail.

  - type: dropdown
    id: installation_method
    attributes:
      label: What is the installation method of your PatchMon server?
      options:
        - ""
        - Docker
        - Proxmox-community script
        - setup.sh native install script
        - Other
    validations:
      required: true

  - type: input
    id: patchmon_version
    attributes:
      label: What is the version of your PatchMon server?
      placeholder: "e.g. 1.4.0"
    validations:
      required: true

  - type: input
    id: feature_summary
    attributes:
      label: Briefly describe the feature
      placeholder: "e.g., Add support for XYZ"
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: Detailed description
      placeholder: Explain the feature in detail
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Why is this useful?
      placeholder: Describe the benefit of this feature
    validations:
      required: true
