name: "Other"
description: Something that is genuinely not a bug, a feature request or a question
title: "[Other]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you continue — most things have a better home:**

        - 🐛 Something broken? Use the **Bug Report** template.
        - 💡 An idea for a new feature? → [feedback.patchmon.net](https://feedback.patchmon.net)
        - ❓ A question or "how do I...?" → [Discussions](https://github.com/PatchMon/PatchMon/discussions)
        - 🔒 A security vulnerability? → [Report it privately](https://github.com/PatchMon/PatchMon/security/advisories/new)

        If none of those fit, please describe your issue below.

  - type: dropdown
    id: installation_method
    attributes:
      label: What is the installation method of your PatchMon server?
      options:
        - ""
        - Docker
        - Proxmox-community script
        - setup.sh native install script
        - Other
    validations:
      required: true

  - type: input
    id: patchmon_version
    attributes:
      label: What is the version of your PatchMon server?
      placeholder: "e.g. 1.4.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Please describe your issue or inquiry in detail
    validations:
      required: true
