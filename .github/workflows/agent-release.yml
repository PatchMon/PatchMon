name: Release Changelog

# Fires when you publish a release in the GitHub UI. Binaries, checksums and
# provenance are built and uploaded by docker.yml, which fires on the tag that
# publishing creates.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG_NAME: ${{ github.event.release.tag_name }}

jobs:
  changelog:
    name: Publish the feedback portal changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Resolve version and fetch release notes
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG_NAME }}

      # Idempotent: entries are matched by the exact title "Version X.Y.Z" and
      # updated in place, so a rerun is safe.
      - name: Push notes to the Quackback changelog
        env:
          QUACKBACK_API_KEY: ${{ secrets.QUACKBACK_API_KEY }}
          VERSION: ${{ steps.ctx.outputs.version }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          if [ -z "${QUACKBACK_API_KEY}" ]; then
            echo "::warning::QUACKBACK_API_KEY is not set — skipping the feedback portal changelog."
            exit 0
          fi
          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "Pre-release: leaving the changelog entry as a draft."
            PUBLISHED_AT=""
          fi
          export PUBLISHED_AT
          chmod +x .github/scripts/publish-changelog.sh
          .github/scripts/publish-changelog.sh "$VERSION" \
            "server-source-code/internal/handler/release_notes_data/RELEASE_NOTES_${VERSION}.md"
