name: Release Binaries

# Fires when you publish a release in the GitHub UI. Publishing is what creates
# the tag, so this and docker.yml (on the tag push) run in parallel off the same
# action. Both pull the release notes out of the release body and compile them
# into the binaries they build.
#
# NOTE: the `tags:` filter is not a valid key under `on.release` in GitHub Actions
# and was silently ignored. If you want to restrict by tag pattern, add
# `if: startsWith(github.event.release.tag_name, 'v')` to each job.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG_NAME: ${{ github.event.release.tag_name }}

jobs:
  agent:
    name: Build Agent Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: 'amd64'
          - goos: linux
            goarch: 'arm64'
          - goos: linux
            goarch: 'arm'
          - goos: linux
            goarch: '386'
          - goos: freebsd
            goarch: 'amd64'
          - goos: freebsd
            goarch: 'arm64'
          - goos: freebsd
            goarch: '386'
          - goos: freebsd
            goarch: 'arm'
          - goos: windows
            goarch: 'amd64'
          - goos: windows
            goarch: 'arm64'

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Resolve version
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG_NAME }}
          fetch-notes: 'false'

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: 'agent-source-code/go.mod'
          cache-dependency-path: 'agent-source-code/go.sum'

      - name: Download dependencies
        working-directory: agent-source-code
        run: go mod download

      - name: Build binary
        working-directory: agent-source-code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ (matrix.goos == 'linux' || matrix.goos == 'freebsd') && matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: 0
          # Already v-stripped; diagnostics.go prints "v%s" and would otherwise
          # emit "vv2.0.0".
          VERSION: ${{ steps.ctx.outputs.version }}
        run: |
          OUTPUT_BASE="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT_NAME="${OUTPUT_BASE}${{ matrix.goos == 'windows' && '.exe' || '' }}"
          go build -buildvcs=false \
            -ldflags="-s -w -X patchmon-agent/internal/pkgversion.Version=${VERSION}" \
            -o "${OUTPUT_NAME}" ./cmd/patchmon-agent

      - name: Verify binary exists and is executable
        working-directory: agent-source-code
        run: |
          OUTPUT_BASE="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT_NAME="${OUTPUT_BASE}${{ matrix.goos == 'windows' && '.exe' || '' }}"
          if [ ! -f "${OUTPUT_NAME}" ]; then
            echo "❌ Error: Binary ${OUTPUT_NAME} was not created"
            exit 1
          fi
          [ "${{ matrix.goos }}" != "windows" ] && chmod +x "${OUTPUT_NAME}" || true
          ls -lh "${OUTPUT_NAME}"
          echo "✅ Binary ${OUTPUT_NAME} created successfully"

      - name: Verify binary architecture and type
        working-directory: agent-source-code
        run: |
          OUTPUT_BASE="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT_NAME="${OUTPUT_BASE}${{ matrix.goos == 'windows' && '.exe' || '' }}"
          echo "📋 Binary information:"
          file "${OUTPUT_NAME}"

          # Verify it's a Linux/FreeBSD binary (ELF format)
          if [ "${{ matrix.goos }}" = "linux" ] || [ "${{ matrix.goos }}" = "freebsd" ]; then
            if ! file "${OUTPUT_NAME}" | grep -qE "(ELF|Linux)"; then
              echo "❌ Error: Binary is not a Linux/FreeBSD binary (expected ELF format)"
              exit 1
            fi
            echo "✅ Verified: ${{ matrix.goos }} binary (ELF format)"
          # Verify it's a Windows binary (PE format)
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            if ! file "${OUTPUT_NAME}" | grep -qE "(PE32|Windows)"; then
              echo "❌ Error: Binary is not a Windows binary (expected PE format)"
              exit 1
            fi
            echo "✅ Verified: Windows binary (PE format)"
          fi

      - name: Test binary basic functionality
        working-directory: agent-source-code
        run: |
          OUTPUT_BASE="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          OUTPUT_NAME="${OUTPUT_BASE}${{ matrix.goos == 'windows' && '.exe' || '' }}"

          # Test version command (if available)
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            echo "🧪 Testing binary functionality..."
            ./"${OUTPUT_NAME}" --version || ./"${OUTPUT_NAME}" version || echo "Version command not available (may require config)"
            ./"${OUTPUT_NAME}" --help || ./"${OUTPUT_NAME}" help || echo "Help command not available"
            echo "✅ Basic functionality test passed"
          else
            echo "⏭️  Skipping functionality test for ${{ matrix.goos }}/${{ matrix.goarch }} (requires native architecture)"
          fi

      - name: Verify static linking (Linux/FreeBSD)
        if: matrix.goos == 'linux' || matrix.goos == 'freebsd'
        working-directory: agent-source-code
        run: |
          OUTPUT_NAME="patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "🔍 Checking binary dependencies..."

          # Check if binary is statically linked (should have minimal or no dynamic dependencies)
          if command -v ldd &> /dev/null; then
            DEPS=$(ldd "${OUTPUT_NAME}" 2>/dev/null | wc -l || echo "0")
            if [ "$DEPS" -gt "3" ]; then
              echo "⚠️  Warning: Binary may have dynamic dependencies:"
              ldd "${OUTPUT_NAME}" 2>/dev/null || true
            else
              echo "✅ Binary appears to be statically linked (minimal dependencies)"
            fi
          fi

          # Check for GLIBC version requirements
          if command -v objdump &> /dev/null; then
            echo "🔍 Checking GLIBC version requirements..."
            GLIBC_VERSIONS=$(objdump -T "${OUTPUT_NAME}" 2>/dev/null | grep "GLIBC_" | sed 's/.*GLIBC_\([0-9.]*\).*/\1/' | sort -V -u || echo "")
            if [ -n "$GLIBC_VERSIONS" ]; then
              echo "📌 GLIBC versions required:"
              echo "$GLIBC_VERSIONS"
              # Check if any version is > 2.28 (Debian Buster)
              HIGHEST=$(echo "$GLIBC_VERSIONS" | tail -1)
              if [ -n "$HIGHEST" ]; then
                echo "ℹ️  Highest GLIBC requirement: $HIGHEST"
                echo "✅ With CGO_ENABLED=0, binary should work on Debian Buster (GLIBC 2.28)"
              fi
            else
              echo "✅ No GLIBC version requirements found (statically linked)"
            fi
          fi
      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 #v4.1.0
        with:
          subject-path: agent-source-code/patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

      - name: Upload agent binary to release
        uses: softprops/action-gh-release@b25b93d384199fc0fc8c2e126b2d937a0cbeb2ae
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: agent-source-code/patchmon-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}

      - name: Build summary
        run: |
          echo "📦 Build Summary:"
          echo "  OS: ${{ matrix.goos }}"
          echo "  Architecture: ${{ matrix.goarch }}"
          echo "  CGO_ENABLED: 0 (static linking)"
          echo ""
          echo "✅ Binary built and uploaded to release"

  patchmon-server:
    name: Build patchmon-server Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: linux
            goarch: 386

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Resolves the version and writes the release notes from the GitHub
      # release into release_notes_data/ so //go:embed compiles them into the
      # binary. Nothing is committed.
      - name: Resolve version and inject release notes
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG_NAME }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: "package.json"
          cache: "npm"

      # The UI reads its version from /api/v1/version/current, not from a Vite
      # build-time variable, so nothing is injected here.
      - name: Build frontend for embed
        run: |
          npm ci
          npm run build --workspace=frontend
          mkdir -p server-source-code/cmd/server/static/frontend
          cp -r frontend/dist server-source-code/cmd/server/static/frontend/

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: 'server-source-code/go.mod'
          cache-dependency-path: 'server-source-code/go.sum'

      - name: Download dependencies
        working-directory: server-source-code
        run: go mod download

      - name: Build patchmon-server
        working-directory: server-source-code
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '6' || '' }}
          CGO_ENABLED: 0
          VERSION: ${{ steps.ctx.outputs.version }}
        run: |
          OUTPUT_NAME="patchmon-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -buildvcs=false \
            -ldflags="-s -w -X 'github.com/PatchMon/PatchMon/server-source-code/internal/config.DefaultVersion=${VERSION}'" \
            -o "${OUTPUT_NAME}" ./cmd/server
          mv "${OUTPUT_NAME}" ../

      - name: Generate artifact attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 #v4.1.0
        with:
          subject-path: patchmon-server-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload patchmon-server to release
        uses: softprops/action-gh-release@b25b93d384199fc0fc8c2e126b2d937a0cbeb2ae
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: patchmon-server-${{ matrix.goos }}-${{ matrix.goarch }}

  changelog:
    name: Draft the feedback portal changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Resolve version and fetch release notes
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}
          tag: ${{ env.TAG_NAME }}

      # Creates the entry as a draft so the notes can be proofread on the portal
      # before they go public. Idempotent: entries are matched by the exact
      # title "Version X.Y.Z" and updated in place, so a rerun is safe.
      - name: Push notes to the Quackback changelog
        env:
          QUACKBACK_API_KEY: ${{ secrets.QUACKBACK_API_KEY }}
          VERSION: ${{ steps.ctx.outputs.version }}
        run: |
          if [ -z "${QUACKBACK_API_KEY}" ]; then
            echo "::warning::QUACKBACK_API_KEY is not set — skipping the feedback portal changelog."
            exit 0
          fi
          chmod +x .github/scripts/publish-changelog.sh
          .github/scripts/publish-changelog.sh "$VERSION" \
            "server-source-code/internal/handler/release_notes_data/RELEASE_NOTES_${VERSION}.md"

  # Runs once after all 14 binaries are on the release, rather than inside each
  # matrix leg, so there is a single provenance statement covering the whole
  # set and a single SHA256SUMS file.
  #
  # Until now a release asset could not be verified at all: no checksums, no
  # signature. The SBOM is a CRA essential requirement (Annex I Part II point
  # 1); the provenance attestation is not mandated by the CRA but is what
  # supply-chain reviews ask for and is near-free alongside it.
  attest:
    name: Checksums, SBOM and provenance
    needs: [agent, patchmon-server]
    runs-on: ubuntu-latest
    # Job-level block replaces the workflow-level `contents: write`, so it has
    # to be restated here alongside the two attestation scopes.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      # Generated before the binaries are downloaded so the scan covers the
      # source tree only and does not re-catalogue the built artefacts.
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          upload-artifact: false
          # Defaults to true and this workflow runs on `release`, so without
          # it the action attaches its own copy under a name of its choosing
          # and the explicit upload below becomes a duplicate.
          upload-release-assets: false

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern 'patchmon-agent-*' \
            --pattern 'patchmon-server-*'
          ls -la dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum patchmon-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/patchmon-*'

      - name: Upload checksums and SBOM to release
        uses: softprops/action-gh-release@b25b93d384199fc0fc8c2e126b2d937a0cbeb2ae
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            dist/SHA256SUMS
            sbom-source.cdx.json
