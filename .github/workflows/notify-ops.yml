name: notify-ops

on:
  issues:
    types: [opened]
  discussion:
    types: [created]

permissions: {}

jobs:
  dispatch:
    if: github.event.sender.type != 'Bot' && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    environment: ops-dispatch
    steps:
      - name: Wake the ops fast lane
        env:
          OPS_DISPATCH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$OPS_DISPATCH_TOKEN" ]; then
            echo "Dispatch token not set; skipping"
            exit 0
          fi
          api="https://api.github.com/repos/PatchMon/patchmon-ops/actions"
          body="$RUNNER_TEMP/ops-api.json"
          since=$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          checks="workflows/item.yml/runs?status=queued
          workflows/item.yml/runs?status=in_progress
          workflows/item.yml/runs?created=%3E%3D$since
          workflows/digest.yml/runs?status=queued
          workflows/digest.yml/runs?status=pending
          workflows/approvals.yml/runs?status=queued
          workflows/approvals.yml/runs?status=pending"
          while read -r path; do
            code=$(curl -sS -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$path") || code=000
            if [ "$code" != "200" ]; then
              echo "Status check failed (HTTP $code); skipping"
              exit 0
            fi
            if [ "$(jq -r '.total_count' "$body")" != "0" ]; then
              echo "Ops runs busy or recent; the scheduled run will pick this up"
              exit 0
            fi
          done <<< "$checks"
          code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $OPS_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"main"}' \
            "$api/workflows/item.yml/dispatches") || code=000
          echo "Dispatch returned HTTP $code"
