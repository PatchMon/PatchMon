# Ensures the repository's process labels exist.
#
# `approved-for-build` gates Docker builds for fork PRs. The rest support the
# issue-routing flow: features are tracked on feedback.patchmon.net, bugs stay
# here, and PRs that arrive without an accepted feature request get parked
# rather than closed.
name: Ensure labels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ensure-labels.yml']
  workflow_dispatch:

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure process labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              {
                name: 'approved-for-build',
                description: 'Maintainer-approved: run Docker build and push to Harbor for this fork PR',
                color: '0E8A16'
              },
              {
                name: 'moved-to-feedback',
                description: 'Imported to feedback.patchmon.net — tracked there from now on',
                color: '5319E7'
              },
              {
                name: 'needs-triage',
                description: 'Not yet reviewed by a maintainer',
                color: 'FBCA04'
              },
              {
                name: 'deferred-stability-phase',
                description: 'Parked while we focus on stability — will be revisited, not rejected',
                color: 'D93F0B'
              },
              {
                name: 'needs-accepted-request',
                description: 'Feature PR with no accepted request on feedback.patchmon.net',
                color: 'D93F0B'
              },
              {
                name: 'documentation',
                description: 'Documentation only',
                color: '0075CA'
              }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
                console.log(`Label ${label.name} already exists`);
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ...label
                  });
                  console.log(`Created label ${label.name}`);
                } else {
                  throw e;
                }
              }
            }
