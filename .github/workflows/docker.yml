name: Build and Push Docker Images

# pull_request_target: needed for fork PRs to receive secrets when approved via label.
# Same-repo PRs run automatically; fork PRs run only when labeled "approved-for-build".
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request_target:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      push:
        description: Push images to registry
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  HARBOR_REGISTRY: cr.dev.patchmon.cloud

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-agents:
    name: Build agent binaries
    runs-on: ubuntu-latest
    # Same-repo PRs: always run. Fork PRs: run only when maintainer adds "approved-for-build" label.
    if: |
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.head.repo.full_name == github.repository ||
      contains(join(github.event.pull_request.labels.*.name, ', '), 'approved-for-build')
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # Branch and PR builds resolve their version with `git describe`,
          # which walks history to find the nearest tag. fetch-tags alone is not
          # enough: it fetches the tag refs, but a shallow clone has no ancestry
          # to walk, so describe fails with "No tags can describe".
          fetch-depth: 0

      - name: Resolve version
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}
          fetch-notes: 'false'

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: 'agent-source-code/go.mod'
          cache-dependency-path: 'agent-source-code/go.sum'

      - name: Build all agent binaries
        working-directory: agent-source-code
        env:
          CGO_ENABLED: 0
          VERSION: ${{ steps.ctx.outputs.version }}
        run: |
          mkdir -p ../agents-prebuilt
          for target in "linux/amd64" "linux/arm64" "linux/386" "linux/arm" \
                        "freebsd/amd64" "freebsd/arm64" "freebsd/386" "freebsd/arm" \
                        "windows/amd64" "windows/arm64"; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            export GOOS GOARCH
            case "$GOARCH" in arm) export GOARM=6 ;; *) unset GOARM ;; esac
            SUFFIX=""; case "$GOOS" in windows) SUFFIX=".exe" ;; esac
            go build -buildvcs=false \
              -ldflags="-s -w -X patchmon-agent/internal/pkgversion.Version=$VERSION" \
              -o "../agents-prebuilt/patchmon-agent-${GOOS}-${GOARCH}${SUFFIX}" ./cmd/patchmon-agent
          done

      - name: Upload agent binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-binaries
          path: agents-prebuilt/

  build-server:
    name: Build server image
    needs: build-agents
    runs-on: ubuntu-latest
    # id-token/attestations are scoped to this job rather than the workflow so
    # `build-agents` cannot mint a Sigstore token. They are needed by the
    # attest-* steps at the end of this job.
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      attestations: write
    # Hoist the Harbor-secret presence check to a job-level env var.
    # GitHub Actions does not allow the `secrets` context in step-level `if:`
    # expressions for some trigger types (you'll see
    #   "Unrecognized named-value: 'secrets'"
    # at workflow parse time). Evaluating the expression here converts it into
    # a plain string "true"/"false" which step-level `if:` CAN read via env.
    env:
      HAS_HARBOR: ${{ secrets.HARBOR_USERNAME != '' && secrets.HARBOR_TOKEN != '' }}
      # Mirrors the `push:` expression on the GHCR build step below. The
      # attestation steps must not run when nothing was pushed, because
      # build-push-action still emits a digest for a build that stayed local
      # and `push-to-registry: true` would then fail against a digest the
      # registry has never seen.
      PUSHED: ${{ github.event_name != 'pull_request_target' && (github.event_name != 'workflow_dispatch' || inputs.push == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          # Branch and PR builds resolve their version with `git describe`,
          # which walks history to find the nearest tag. fetch-tags alone is not
          # enough: it fetches the tag refs, but a shallow clone has no ancestry
          # to walk, so describe fails with "No tags can describe".
          fetch-depth: 0

      # Resolves the version and, on a release tag, writes the release notes
      # from the GitHub release into release_notes_data/ so //go:embed compiles
      # them into the image. Nothing is committed.
      - name: Resolve version and inject release notes
        id: ctx
        uses: ./.github/actions/release-context
        with:
          token: ${{ github.token }}

      - name: Fetch community counts
        id: social
        # Bakes the current GitHub/Discord/YouTube/LinkedIn counts into the
        # binary so the nav, login footer and setup wizard are accurate as of
        # the release. patchmon.net/socialstats is public and unauthenticated,
        # so this works on forks with no secrets configured.
        #
        # Never fails the build: an unreachable endpoint leaves the outputs
        # empty and the server keeps its compiled-in defaults, while a
        # deliberate 0 from the endpoint hides that number instead.
        continue-on-error: true
        run: |
          for platform in github discord youtube linkedin; do
            count="$(curl -fsS --max-time 10 --retry 2 --retry-delay 2 \
              "https://patchmon.net/socialstats/${platform}" 2>/dev/null || true)"
            count="$(printf '%s' "$count" | tr -dc '0-9')"
            if [ -z "$count" ]; then
              echo "::notice::no count for ${platform}; keeping compiled-in default"
            else
              echo "${platform}=${count}" >> "$GITHUB_OUTPUT"
              echo "${platform}: ${count}"
            fi
          done

      - name: Download agent binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-binaries
          path: agents-prebuilt/

      - name: Log in to container registry (GHCR)
        if: github.event_name != 'pull_request_target'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract metadata (tags, labels) for GHCR
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-server
          # `latest=auto` tags release builds (semver pushes) as `:latest` but
          # leaves branch/edge builds alone.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

      # Harbor is staging only: PR previews and the `main` edge build. Releases
      # go to GHCR alone, hence the ref_type gate here and on every Harbor step
      # below. Any future Harbor name needs a project prefix; Harbor rejects a
      # single-segment name with `400 invalid repository name`.
      - name: Extract metadata (tags, labels) for Harbor
        id: meta-harbor
        if: env.HAS_HARBOR == 'true' && github.ref_type != 'tag'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.HARBOR_REGISTRY }}/pr/patchmon-server
          # No `type=semver` or `latest=auto`: both only emit on a tag ref.
          tags: |
            type=edge,branch=main
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr,prefix=pr-

      - name: Build and push server image to GHCR (main/tags only)
        id: build
        if: github.event_name != 'pull_request_target' && steps.meta.outputs.tags != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ctx.outputs.version }}
            GITHUB_STARS=${{ steps.social.outputs.github }}
            DISCORD_MEMBERS=${{ steps.social.outputs.discord }}
            YOUTUBE_SUBSCRIBERS=${{ steps.social.outputs.youtube }}
            LINKEDIN_FOLLOWERS=${{ steps.social.outputs.linkedin }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false
          # Force gzip on all layers (including base image layers from dhi.io/alpine-base
          # which ship as zstd). Without force-compression, mixed zstd/gzip manifests
          # break Podman <5.7 and Docker without the containerd image store.
          # See: https://github.com/PatchMon/PatchMon/issues/679
          outputs: type=image,compression=gzip,force-compression=true

      # ---------------------------------------------------------------------
      # SBOM and build provenance.
      #
      # The SBOM is a CRA essential requirement (Annex I Part II point 1:
      # components documented in a commonly used machine-readable format).
      # The provenance attestation is not itself mandated by the CRA but backs
      # Annex I Part II point 7, secure distribution of updates.
      #
      # These are Sigstore statements bound to the image digest and stored as
      # OCI referrers. They are deliberately NOT BuildKit's own
      # `provenance: mode=max`, which adds attestation manifests to the image
      # index and surfaces them as `unknown/unknown` platform entries. That is
      # the same manifest-shape change that broke Podman <5.7 in #679, so both
      # the GHCR build above and the Harbor build below keep `provenance: false`
      # and the pull path is untouched.
      #
      # Attached to GHCR always, and to Harbor (2.15.0, which has the OCI
      # referrers API) on the `main` edge build, the only Harbor push that is
      # not a PR. Attestations also land in the GitHub attestation store, so
      # `gh attestation verify` works against any copy of the image whose
      # digest is unchanged, whatever registry it came from.
      #
      # PR builds are deliberately excluded via PUSHED even though they do
      # push to Harbor's /pr/ namespace: signing throwaway images built from
      # unreviewed fork code produces attestations that are noise at best.
      # ---------------------------------------------------------------------
      - name: Resolve image names
        id: img
        if: env.PUSHED == 'true'
        # `github.repository` is `PatchMon/PatchMon`, and the attest-* actions
        # reject a mixed-case subject-name. The GHCR build step above never
        # hits this because docker/metadata-action lowercases internally.
        #
        # REGISTRY and HARBOR_REGISTRY come from the workflow-level env block.
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "ghcr=${REGISTRY}/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')-server" >> "$GITHUB_OUTPUT"
          echo "harbor=${HARBOR_REGISTRY}/pr/patchmon-server" >> "$GITHUB_OUTPUT"

      # Source-side SBOM. This is not redundant with the image scan below:
      # the React frontend is bundled by Vite and then compiled into the Go
      # binary with //go:embed, so once it is inside the image the npm
      # dependency tree is gone and no cataloguer can recover it. npm
      # workspaces keep the only lockfile at the repo root.
      - name: Generate source SBOM
        if: env.PUSHED == 'true' && steps.build.outputs.digest != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          upload-artifact: false

      # Image SBOM: Alpine base packages plus the Go module graph of the
      # server binary and the 10 bundled agent binaries (Go buildinfo survives
      # `-s -w`). Syft resolves a multi-arch index to linux/amd64; the module
      # and package sets do not differ by arch here.
      - name: Generate image SBOM
        if: env.PUSHED == 'true' && steps.build.outputs.digest != ''
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.img.outputs.ghcr }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          upload-artifact: false

      - name: Attest build provenance (GHCR)
        if: env.PUSHED == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM (GHCR)
        if: env.PUSHED == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.img.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true

      # Also kept as a plain artifact so an SBOM can be pulled without going
      # through the registry referrers API.
      - name: Upload SBOMs
        if: env.PUSHED == 'true' && steps.build.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-server-${{ steps.ctx.outputs.version }}
          path: |
            sbom-image.cdx.json
            sbom-source.cdx.json

      # Both Harbor steps run last, login included. A failing step ends the job
      # and skips everything after it whatever its `if:` says, so a Harbor
      # problem here cannot cost the GHCR image or its SBOM and attestations.
      - name: Log in to Harbor
        # Also skipped when HARBOR_USERNAME/HARBOR_TOKEN aren't set, so forks
        # and test repos fall through to a GHCR-only build.
        if: env.HAS_HARBOR == 'true' && github.ref_type != 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push server image to Harbor (PRs and main only)
        id: build-harbor
        if: env.HAS_HARBOR == 'true' && github.ref_type != 'tag' && steps.meta-harbor.outputs.tags != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ctx.outputs.version }}
            GITHUB_STARS=${{ steps.social.outputs.github }}
            DISCORD_MEMBERS=${{ steps.social.outputs.discord }}
            YOUTUBE_SUBSCRIBERS=${{ steps.social.outputs.youtube }}
            LINKEDIN_FOLLOWERS=${{ steps.social.outputs.linkedin }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push == 'true' }}
          tags: ${{ steps.meta-harbor.outputs.tags }}
          labels: ${{ steps.meta-harbor.outputs.labels }}
          # Reads the shared cache but deliberately never writes it.
          #
          # On pull_request_target the Actions runtime token is read-only
          # ("Actions runtime token ACs: refs/heads/main: read"), so a gha cache
          # export fails the whole step with "failed to reserve cache" — after
          # the image has already been built and pushed, which made the job look
          # like a build failure when it was not.
          #
          # On main and tags the GHCR step above already exports to this exact
          # scope from an identical build, so exporting again here would just
          # repeat ~50s of "preparing build cache for export" for no benefit.
          #
          # Either way PR builds still get fast cache HITS from main via
          # cache-from; they simply do not write back.
          cache-from: type=gha,scope=server
          provenance: false
          # Force gzip on all layers (including base image layers from dhi.io/alpine-base
          # which ship as zstd). Without force-compression, mixed zstd/gzip manifests
          # break Podman <5.7 and Docker without the containerd image store.
          # See: https://github.com/PatchMon/PatchMon/issues/679
          outputs: type=image,compression=gzip,force-compression=true

      - name: Attest build provenance (Harbor)
        if: env.PUSHED == 'true' && env.HAS_HARBOR == 'true' && steps.build-harbor.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.harbor }}
          subject-digest: ${{ steps.build-harbor.outputs.digest }}
          push-to-registry: true

      # Reuses the SBOM scanned from the GHCR image rather than pulling the
      # Harbor one again. The two are separate build-push-action invocations
      # from the same context with the same build args, so the digests can
      # differ but the component set cannot. Guarded on the GHCR digest as
      # well, because that is what produced the file.
      - name: Attest image SBOM (Harbor)
        if: env.PUSHED == 'true' && env.HAS_HARBOR == 'true' && steps.build-harbor.outputs.digest != '' && steps.build.outputs.digest != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.img.outputs.harbor }}
          subject-digest: ${{ steps.build-harbor.outputs.digest }}
          sbom-path: sbom-image.cdx.json
          push-to-registry: true

      # Locate a previous image comment by its marker so a re-push updates it
      # instead of appending another one. `synchronize` is a trigger, so
      # without this every push to the PR leaves a fresh near-identical comment.
      - name: Find existing image comment
        id: find-comment
        if: github.event_name == 'pull_request_target' && steps.build-harbor.outcome == 'success' && steps.build-harbor.outputs.digest != ''
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- patchmon-docker-pr -->'

      # comment-id empty (first run) creates against issue-number; set (re-push)
      # updates that comment. edit-mode: replace, or the body is appended to and
      # the comment grows a copy per push.
      - name: Comment on PR with image URL
        if: github.event_name == 'pull_request_target' && steps.build-harbor.outcome == 'success' && steps.build-harbor.outputs.digest != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- patchmon-docker-pr -->
            ## Docker image for testing

            Image built and pushed to Harbor:

            - **Image:** `${{ env.HARBOR_REGISTRY }}/pr/patchmon-server:pr-${{ github.event.pull_request.number }}`
            - **Digest:** `${{ env.HARBOR_REGISTRY }}/pr/patchmon-server@${{ steps.build-harbor.outputs.digest }}`

            Use in your `docker-compose.yml`:

            ```yaml
            services:
              patchmon-server:
                image: ${{ env.HARBOR_REGISTRY }}/pr/patchmon-server:pr-${{ github.event.pull_request.number }}
            ```

            Or use the digest for reproducibility:

            ```yaml
            services:
              patchmon-server:
                image: ${{ env.HARBOR_REGISTRY }}/pr/patchmon-server@${{ steps.build-harbor.outputs.digest }}
            ```

