name: Version Check DNS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to point the vcheck records at, e.g. 2.1.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vcheck-dns
  cancel-in-progress: true

jobs:
  bump:
    name: Point the vcheck records at the release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    environment:
      name: ${{ github.event_name == 'release' && 'vcheck-dns-soak' || 'vcheck-dns' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Update the records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — the vcheck records were left alone."
            exit 0
          fi

          VERSION="${INPUT_VERSION:-${TAG#v}}"
          chmod +x .github/scripts/update-vcheck-dns.sh
          .github/scripts/update-vcheck-dns.sh "$VERSION"
